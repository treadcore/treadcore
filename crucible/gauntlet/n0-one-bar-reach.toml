# The CUDA gauntlet, the route alone (crucible, 6 November). Every M file asks for its pillbox to be taken,
# and no net takes even T1's in the open, so M0 to M3 measured the capture as much as the way. This is M0's
# maze with the pillbox gone: passed when the tank ends within 3 tiles of where the pillbox stood (treadcore's
# ends_near; the run stops when it gets there). Its tasks teach the route first (the curriculum, Gomez and
# Miikkulainen); M0 to M3 then ask for the capture at its end.
name = "N0 one bar: round the corner to its far side"
needs = "forest"
reaction = "move"
floor = 0.0
seconds = 40
[[tank]]
seat = 0
at = "centre"
offset = [-12, 0]
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [-28, 28]
[[terrain]]
near = "centre"
kind = "wall"
x = [-1, 0]
y = [-8, 8]
[[brain]]
seat = 0
kind = "net"
[expect]
ends_near = { seat = 0, at = "centre", offset = [10, 0], within = 3 }
