# The CUDA gauntlet, the route alone (crucible, 6 November). Every M file asks for its pillbox to be taken,
# and no net takes even T1's in the open, so M0 to M3 measured the capture as much as the way. This is M3's
# maze with the pillbox gone: passed when the tank ends within 3 tiles of where the pillbox stood (treadcore's
# ends_near; the run stops when it gets there). Its tasks teach the route first (the curriculum, Gomez and
# Miikkulainen); M0 to M3 then ask for the capture at its end.
name = "N3 the @ maze: reach its centre"
needs = "forest"
reaction = "move"
floor = 0.0
seconds = 150
[[tank]]
seat = 0
at = "centre"
offset = [27, 27]
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [-28, -28]
[[terrain]]
near = "centre"
kind = "wall"
x = [-23, 23]
y = [22, 23]
[[terrain]]
near = "centre"
kind = "wall"
x = [-23, 23]
y = [-23, -22]
[[terrain]]
near = "centre"
kind = "wall"
x = [-23, -22]
y = [-23, 23]
[[terrain]]
near = "centre"
kind = "wall"
x = [22, 23]
y = [-23, 8]
[[terrain]]
near = "centre"
kind = "wall"
x = [-13, 13]
y = [12, 13]
[[terrain]]
near = "centre"
kind = "wall"
x = [-13, 13]
y = [-13, -12]
[[terrain]]
near = "centre"
kind = "wall"
x = [12, 13]
y = [-13, 13]
[[terrain]]
near = "centre"
kind = "wall"
x = [-13, -12]
y = [-13, -2]
[[brain]]
seat = 0
kind = "net"
[expect]
ends_near = { seat = 0, at = "centre", offset = [0, 0], within = 3 }
