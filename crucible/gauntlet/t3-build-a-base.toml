# The CUDA gauntlet, player against environment (crucible, 6 November; Paul: "navigate a simple maze, Like a
# maze of S shaped and 5 Shaped, and @ ... where we add takeover tasks like Pillbox capture, Base capture,
# Building a base capture"). BUILD A BASE. A neutral pillbox 10 tiles off; a Raider comes from 30 tiles. Decision: take the pillbox and hold the ground while the base is built, 20 s, the pillbox fighting beside the tank. Passed: held 20 s within 60 s.
name = "T3 build a base: take the ground and hold it"
needs = "forest"
reaction = "fire"
floor = 0.0
seconds = 60
[[tank]]
seat = 0
at = "centre"
offset = [-10, 0]
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [20, 0]
toward = "seat:0"
[[pillbox]]
near = "centre"
[[brain]]
seat = 1
kind = "raider"
[[brain]]
seat = 0
kind = "net"
[expect]
hold = { pillbox = 0, seconds = 20 }
alive = { seat = 0 }
