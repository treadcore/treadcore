# Packages for a release. On a tag v<version> (pushed after `make release`
# passed: the pre-push hook in .githooks/ runs it), build:
#
#   treadcore-<version>-linux-amd64.deb     Debian 12+, Ubuntu 22.04+, Mint 21+
#   treadcore-<version>-linux-arm64.deb
#   treadcore-<version>-linux-x86_64.rpm    Fedora 40+
#   treadcore-<version>-linux-aarch64.rpm
#   treadcore-<version>-windows-x86_64.zip
#   treadcore-<version>-macos-arm64.zip     Treadcore.app, ad-hoc signed
#   SHA256SUMS
#
# test each one where its users are (install the .deb on fresh Debian,
# Ubuntu and Linux Mint, the .rpm on fresh Fedora, unzip on Windows
# and macOS; then run the installed programs: a headless bot match,
# the window's --help, every linked library found), build the Nix
# flake, and only when the packages' tests pass, put them on a DRAFT
# GitHub release. Nothing is public until a
# person publishes the draft, no sooner than a day after the tag
# (RELEASE.md section 6). download.html links to these names.
#
# The packages carry the window's runtime dependencies, the same list
# as scripts/deps.sh (source/treadcore-client/Cargo.toml says which and
# why). Rust is never one: they are built binaries. The build here uses
# rustup's stable toolchain.
name: packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      rpmversion: ${{ steps.v.outputs.rpmversion }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "rpmversion=${v//-/\~}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} is not v$v, the version in Cargo.toml"; exit 1
          fi

  deb:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: system packages (scripts/deps.sh, Debian line)
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p treadcore-client -p treadcore-server
      - run: cargo install --locked cargo-deb
      - run: cargo deb -p treadcore-client --no-build -o "treadcore-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.deb"
      - uses: actions/upload-artifact@v4
        with: { name: "deb-${{ matrix.arch }}", path: "*.deb" }

  rpm:
    needs: version
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    container: fedora:41
    steps:
      - name: system packages (scripts/deps.sh, Fedora line)
        run: dnf install -y gcc git pkgconf-pkg-config wayland-devel libxkbcommon-devel alsa-lib-devel systemd-devel
      - uses: actions/checkout@v4
      - name: rust (rustup, stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p treadcore-client -p treadcore-server
      - run: cargo install --locked cargo-generate-rpm
      - run: cargo generate-rpm -p source/treadcore-client --set-metadata 'version = "${{ needs.version.outputs.rpmversion }}"' -o "treadcore-${{ needs.version.outputs.version }}-linux-${{ matrix.arch }}.rpm"
      - uses: actions/upload-artifact@v4
        with: { name: "rpm-${{ matrix.arch }}", path: "*.rpm" }

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p treadcore-client -p treadcore-server
      - name: zip
        shell: pwsh
        run: |
          $d = "treadcore-${{ needs.version.outputs.version }}-windows-x86_64"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/release/treadcore.exe, target/release/treadcore-server.exe, README.md, documentation/HOW-TO-PLAY.md, LICENSE $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "*.zip" }

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Treadcore.app (scripts/install.sh, into a staging prefix)
        run: |
          PREFIX="$RUNNER_TEMP/p" APPDIR="$RUNNER_TEMP/apps" make install
          d="treadcore-${{ needs.version.outputs.version }}-macos-arm64"
          mkdir "$d"
          cp -R "$RUNNER_TEMP/apps/Treadcore.app" "$d/"
          cp "$RUNNER_TEMP/p/bin/treadcore-server" README.md documentation/HOW-TO-PLAY.md LICENSE "$d/"
          ditto -c -k --keepParent "$d" "$d.zip"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "*.zip" }

  # The packages, installed where their users are. The window cannot
  # open without a display here; `treadcore --help` and ldd prove the
  # binary loads with what the package brought, and a 60-second bot
  # match from the installed treadcore-server proves the game runs.
  test-deb:
    needs: [version, deb]
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "linuxmintd/mint22-amd64"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: deb-amd64 }
      - name: install the package (apt resolves its dependencies)
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./treadcore-*-linux-amd64.deb
      - name: run what it installed
        run: |
          set -x
          treadcore --help
          ! ldd /usr/bin/treadcore | grep "not found"
          test -f /usr/share/applications/org.treadcore.treadcore.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/treadcore.svg
          treadcore-server --local --seconds 60 --swarm 0 2>&1 | tee match.log | tail -5
          grep -q "match over" match.log

  test-rpm:
    needs: [version, rpm]
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:41", "fedora:42"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: rpm-x86_64 }
      - name: install the package (dnf resolves its dependencies)
        run: dnf install -y ./treadcore-*-linux-x86_64.rpm
      - name: run what it installed
        run: |
          set -x
          treadcore --help
          ! ldd /usr/bin/treadcore | grep "not found"
          test -f /usr/share/applications/org.treadcore.treadcore.desktop
          treadcore-server --local --seconds 60 --swarm 0 2>&1 | tee match.log | tail -5
          grep -q "match over" match.log

  test-windows:
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows }
      - name: unzip and run
        shell: pwsh
        run: |
          Expand-Archive -Path *.zip -DestinationPath .
          $d = Get-ChildItem -Directory treadcore-*-windows-x86_64 | Select-Object -First 1
          & "$d/treadcore.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$d/treadcore-server.exe" --local --seconds 60 --swarm 0 2>&1 | Tee-Object match.log | Select-Object -Last 5
          if (-not (Select-String -Path match.log -Pattern "match over" -Quiet)) { exit 1 }

  test-macos:
    needs: [version, macos]
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos }
      - name: unzip and run
        run: |
          set -x
          ditto -x -k treadcore-*-macos-arm64.zip .
          d="$(ls -d treadcore-*-macos-arm64 | head -1)"
          codesign --verify --deep "$d/Treadcore.app"
          "$d/Treadcore.app/Contents/MacOS/treadcore" --help
          "$d/treadcore-server" --local --seconds 60 --swarm 0 2>&1 | tee match.log | tail -5
          grep -q "match over" match.log

  # The flake, built from this tag the way a Nix user would. Not a gate
  # on the release: the flake is new, and a failure here is a finding
  # for the next candidate, not a reason to hold the packages back.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L
      - run: ./result/bin/treadcore --help && ./result/bin/treadcore-server --local --seconds 60 --swarm 0 2>&1 | tail -3

  release:
    needs: [version, deb, rpm, windows, macos, test-deb, test-rpm, test-windows, test-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          name: treadcore ${{ needs.version.outputs.version }}
          body: |
            treadcore ${{ needs.version.outputs.version }}. What changed: [CHANGELOG.md](https://github.com/treadcore/treadcore/blob/main/CHANGELOG.md). Which file for which system: [treadcore.org/download.html](https://treadcore.org/download.html). How to play: [HOW-TO-PLAY.md](https://github.com/treadcore/treadcore/blob/main/documentation/HOW-TO-PLAY.md).
          files: out/*
