[package]
name = "treadcore-client"
description = "Treadcore's Bevy client: overhead map, HUD telemetry overlay, controls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "treadcore"
path = "src/main.rs"

[dependencies]
log = { workspace = true }
treadcore-sim = { workspace = true }
treadcore-proto = { workspace = true }
treadcore-net = { workspace = true }
treadcore-brain = { workspace = true }

# Bevy comes from the workspace table at the root, so the window and the
# warm crate (`make warm`) build the same engine once.
bevy = { workspace = true }
