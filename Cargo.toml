# TREADCORE -- a four-player overhead tank/drone arena.
#
# One workspace, six crates, in dependency order:
#
#   treadcore-sim     the deterministic world: map, tanks, drone bays, shells.
#                     Headless. No engine, no sockets. Everything else is a
#                     client of this crate.
#   treadcore-proto   the wire vocabulary: commands, snapshots, events, and
#                     the peer-negotiation messages. serde + bincode.
#   treadcore-net     UDP transport, LAN discovery, RTT matrix, host election
#                     and the relay route; the Host and Client state machines.
#   treadcore-brain   the Brain API (observation in, commands out) and the
#                     rule-based bot that fills empty seats.
#   treadcore-server  headless binary: host a match, run bot-only matches,
#                     write the verbose traces `make debug` captures.
#   treadcore-client  the Bevy window: overhead map, HUD telemetry overlay,
#                     keyboard/mouse control. The only crate that pulls Bevy.
[workspace]
resolver = "2"
members = [
    "source/treadcore-sim",
    "source/treadcore-proto",
    "source/treadcore-net",
    "source/treadcore-brain",
    "source/treadcore-server",
    "source/treadcore-client",
    "source/treadcore-warm",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2021"
rust-version = "1.85"
authors = ["Paul Richeson <paulr@sdf.org>"]
license = "MIT"
repository = "https://github.com/treadcore/treadcore"
homepage = "https://treadcore.org"
readme = "README.md"
keywords = ["game", "tank", "multiplayer", "bevy", "bolo"]
categories = ["games", "game-engines", "simulation"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
log = "0.4"
env_logger = "0.11"
# Each with a version as well as a path: crates.io refuses a package
# whose dependency has only a path, and the five publishable crates
# depend on each other.
treadcore-sim = { path = "source/treadcore-sim", version = "0.1.0-rc.1" }
treadcore-proto = { path = "source/treadcore-proto", version = "0.1.0-rc.1" }
treadcore-net = { path = "source/treadcore-net", version = "0.1.0-rc.1" }
treadcore-brain = { path = "source/treadcore-brain", version = "0.1.0-rc.1" }

# BEVY, DEFINED ONCE. Both the window and the warm crate take it from here,
# so the two resolve to the same feature set and the same artifacts in
# target/: `make warm` compiles the engine, `make build` finds it built.
#
# Pinned to 0.17 (the API the client is written against). Default features
# off, then the ones this game uses: a 2D sprite/text/UI/gizmo window on
# Wayland or X11. Dropped by not listing them: bevy_pbr, gltf, audio,
# animation, picking, scenes -- 65 crates and the heaviest of them.
[workspace.dependencies.bevy]
version = "0.17"
default-features = false
features = [
    "std", "multi_threaded", "bevy_log", "bevy_asset", "bevy_color", "bevy_state",
    "bevy_window", "bevy_winit", "wayland", "x11", "bevy_input_focus",
    "bevy_render", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render",
    "bevy_text", "default_font", "bevy_ui", "bevy_ui_render", "bevy_gizmos",
]

# PROFILES, SIZED FOR A SMALL MACHINE. This is developed in a 6 GB VM, and
# the first attempt at these (dependencies at opt-level 3 with full debug
# info, four rustc at once) ran it out of memory on bevy_ui. So:
#
#   dev       game crates at opt-level 1 with debug info: fast to build,
#             debuggable. Dependencies at opt-level 1 with NO debug info:
#             Bevy's debug info is gigabytes and nobody steps into it.
#             The window in a dev build is playable; `make run` uses
#             release anyway.
#   release   opt-level 3, no LTO, 16 codegen units: the link step stays
#             under a gigabyte. This is what `make run` and `make build`
#             produce.
#   dist      release plus thin LTO and one codegen unit per crate, for
#             a binary to hand to someone. Needs memory and time; it is
#             not the default anywhere.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
debug = false

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
