# The gauntlet (LAB-REPORT-BRAIN.md section 102): one decision, little
# else on the map. A hostile strike drone 14 tiles off on any side, diving at the tank; nothing else. Decision: put up the bubble. Passed: not hit in 8 s.
# Read by `make gauntlet` for the scripted brain, the untrained net and
# every net in nets/, on the same seeds; the reaction it times is
# `reaction`.
name = "G4 a strike drone coming"
reaction = "launch:interceptor"
floor = 0.9
players = 2
seconds = 8
pillboxes = false
depots = false
[[terrain]]
near = "centre"
kind = "grass"
x = [-20, 20]
y = [-20, 20]
[[tank]]
seat = 0
at = "centre"
heading = "any"
[[tank]]
seat = 1
at = "seat:0"
offset = [0, 40]
[[drone]]
owner = 1
kind = "strike"
at = "seat:0"
offset = [14, 0]
around = true
target = 0
[[brain]]
seat = 0
kind = "net"
[expect]
hits_on = { seat = 0, max = 0 }
