# The gauntlet (LAB-REPORT-BRAIN.md section 102): one decision, little
# else on the map. A shell will land on the standing tank in 2 to 3 s, from any side. Decision: move. Passed: not hit.
# Read by `make gauntlet` for the scripted brain, the untrained net and
# every net in nets/, on the same seeds; the reaction it times is
# `reaction`.
name = "G3 a shell on a standing tank"
reaction = "move"
floor = 0.95
players = 2
seconds = 3.5
pillboxes = false
depots = false
[[terrain]]
near = "centre"
kind = "grass"
x = [-20, 20]
y = [-20, 20]
[[tank]]
seat = 0
at = "centre"
heading = "any"
[[tank]]
seat = 1
at = "seat:0"
offset = [0, 40]
[[shell]]
owner = 1
at = "seat:0"
scatter = 1
from = [30, 0]
from_any = true
lands_in = [2, 3]
[[brain]]
seat = 0
kind = "net"
[expect]
hits_on = { seat = 0, max = 0 }
