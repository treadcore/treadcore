# The boundary (LAB-REPORT-BRAIN.md section 141; Paul, 4 November: "we need to setup a goal where
# it would be smart to attack some pillboxes while avoiding others. like enemy preference, last
# attacked enemy we would kite and dance, unless we have backup with fleet allies nearby. we should
# solve it by creating a coded set of tests that should result into that being the boundary").
# A hostile pillbox 9 tiles one way and a neutral one 9 tiles the other: both outside their rings (8),
# both inside the gun's reach (10). Decision: shoot the hostile one from where you stand, and spare the
# neutral one, which a squad takes whole and which fires on whoever enters its ring. Passed: the
# hostile one dead within 12 s, the neutral one untouched, and the tank's armour whole.
