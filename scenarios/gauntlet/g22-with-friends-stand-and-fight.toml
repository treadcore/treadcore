# The boundary (LAB-REPORT-BRAIN.md section 141; Paul, 4 November: "we need to setup a goal where
# it would be smart to attack some pillboxes while avoiding others. like enemy preference, last
# attacked enemy we would kite and dance, unless we have backup with fleet allies nearby. we should
# solve it by creating a coded set of tests that should result into that being the boundary").
# As G21, but two of the tank's own side stand beside it and hold their ground, fighting what comes
# (they do not follow it: staying with them is the tank's own choice). Decision: with backup, do not kite
# away from it: stand with the friends and kill the attacker together. Passed: the attacker dead
# within 30 s, the tank hitting it more often than it was hit by it, and within 10 tiles of a friend for seven
# tenths of it.
