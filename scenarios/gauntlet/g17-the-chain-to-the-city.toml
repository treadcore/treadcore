# The logistics gauntlet, the whole chain (Paul: "trains moving from oil refinery to factory, to
# port, to city"): ore from the deposit to the factory (the smelter), the smelter's shells on a
# worker to the port (the side's depot on the shore), and the port's convoy to the city (the side's
# depot inland, up the road). The tank's part is the first leg; the workers and the convoys are the
# world's once the ore is in. Passed: shells delivered to a depot and a convoy arrived, in two
# minutes. The reward pays each leg.
name = "G17 the chain to the city"
reaction = "move"
floor = 0.95
players = 2
seconds = 120
pillboxes = false
depots = false
[[terrain]]
near = "centre"
kind = "grass"
x = [-30, 30]
y = [-40, 20]
[[terrain]]
near = "centre"
kind = "water"
x = [-30, -22]
y = [-40, 20]
[[terrain]]
near = "centre"
kind = "road"
x = [-18, -18]
y = [-30, 0]
[[tank]]
seat = 0
at = "centre"
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [20, 60]
[[deposit]]
at = "centre"
offset = [8, 0]
stock = 40
[[structure]]
