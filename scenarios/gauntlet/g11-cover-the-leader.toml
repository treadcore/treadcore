# The wingman's gauntlet (the plan of 2 November, chapter 11): cover the leader.
# As G10, and at twenty seconds an enemy tank is set down ten tiles ahead of the
# leader. Decision: hit it, and stay on the leash. Passed: the wingman hits the
# enemy at least once, and is within the leash (twenty tiles) of the leader for
# eight tenths of the run.
name = "G11 cover the leader against what appears ahead"
reaction = "fire"
floor = 0.7
players = 3
teams = [0, 0, 1]
seconds = 45
pillboxes = false
depots = false
