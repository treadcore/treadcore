# The gauntlet (LAB-REPORT-BRAIN.md section 102): one decision, little
# else on the map. A hostile pillbox 9 tiles off: outside its ring (8), inside the gun's reach (10). Decision: shoot it from where you stand. Passed: it is dead within 8 s and did no damage.
# Read by `make gauntlet` for the scripted brain, the untrained net and
# every net in nets/, on the same seeds; the reaction it times is
# `reaction`.
name = "G7 a pillbox from outside its ring"
reaction = "fire"
floor = 0.8
players = 2
seconds = 8
pillboxes = false
depots = false
[[terrain]]
near = "centre"
kind = "grass"
x = [-20, 20]
y = [-20, 20]
[[tank]]
seat = 0
at = "centre"
offset = [9, 0]
around = true
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [0, 40]
[[pillbox]]
near = "centre"
toward = "seat:0"
away = 0.1
owner = 1
[[brain]]
seat = 0
kind = "net"
[expect]
pillbox_alive = { pillbox = 0, alive = false }
pillbox_damage = { pillbox = 0, max = 0 }
