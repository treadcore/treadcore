# For the record, not the gauntlet (LR 135): the same course with a scripted enemy on Auto
# eighteen tiles off, so a clone of it learns the mine and the fight from one world.
# The logistics gauntlet: oil to the refinery. A well eight tiles east; a refinery of the tank's
# side eight tiles west, with its plant, dry; the side's depot beside it. Decision: send the squad
# to the well, bring the oil to the refinery. Passed: oil unloaded within the minute. The scripted
# brain runs it as the oil run (the refinery holds less than oil_low); a net must have learned it.
name = "G14 with an enemy: oil to the refinery"
reaction = "move"
floor = 0.5
players = 2
seconds = 60
pillboxes = false
depots = false
[[terrain]]
