# Commander on the Expand rung with the team board. A teammate stands
# 30 tiles east and sees a hostile tank 8 tiles past it (a team shares
# its sight), so the board's front runs between the two. Two neutral
# depots: one 12 tiles south of the base (the nearest), one 18 tiles
# east toward the front. With `w_front` the tank takes the depot toward
# the front first; at 0 the nearest. `w_front` is 0 by default since
# LR 75, so this sets the old 0.5 to keep the front read itself tested.
