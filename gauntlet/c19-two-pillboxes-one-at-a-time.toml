# The CUDA gauntlet (crucible, 6 November; Paul: "More Cuda gauntlets that match the style of the CPU
# gauntlet"): one decision, little else in the arena, read by `crucible --gauntlet` for each segment's
# champion and the newest milestone on the same runs. Treadcore's G19. Two pillboxes, 9.5 and 14.5 tiles off in a line. Decision: take them one at a time from outside their rings. Passed: both dead within 40 s and the tank's armour whole.
name = "C19 two pillboxes, one at a time from outside their rings"
cpu = "G19"
reaction = "fire"
floor = 0.0
seconds = 40
[[tank]]
seat = 0
at = "centre"
offset = [-14, 0]
heading = "any"
[[tank]]
seat = 1
at = "centre"
offset = [28, 0]
[[pillbox]]
near = "seat:0"
toward = "seat:1"
away = 9.5
[[pillbox]]
near = "pillbox:0"
toward = "seat:1"
away = 5
[[brain]]
seat = 0
kind = "net"
[expect]
pillboxes_standing = { max = 0 }
armor_at_least = { seat = 0, share = 1.0 }
