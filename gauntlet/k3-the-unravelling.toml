# THE CAMP (crucible, 6 November; Paul: "a good set of rewards and cookies for after correctly solving the maze ...
# the first items done right should score good reward, and at that point we can step through milestones like a
# maze that unravels in complexity. Like driving onto a spot, then spawning castles at a predictable location after
# stepping on the beacon, or taking over base, or castle"). Stages in order; each pays its reward, twice it when done
# at once, falling to the reward itself at `quick` seconds; a dormant pillbox rises when the stage that spawns it
# begins. Every position here is the file's to move.
# K3, THE UNRAVELLING: round one bar to a beacon; on it, a castle rises inside a ring of wall with no gate, to be
# broken into and taken -- the corner, then the breach, one after the other.
