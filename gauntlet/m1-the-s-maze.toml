# The CUDA gauntlet, player against environment (crucible, 6 November; Paul: "navigate a simple maze, Like a
# maze of S shaped and 5 Shaped, and @ ... where we add takeover tasks like Pillbox capture, Base capture,
# Building a base capture"). THE S. Two bars of wall, staggered: the pillbox at the top right is reached by going right, round the first bar's end, left, round the second's, and right again. The pillbox's bearing is in the net's senses through the walls; the rays see the walls. Decision: find the way, shoot the pillbox from outside its ring, and drive onto its rubble. Passed: it is the tank's within 90 s.
name = "M1 the S maze: take the pillbox at its end"
